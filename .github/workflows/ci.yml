name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/herdr-instabox .
      - run: python3 scripts/check-docs.py
