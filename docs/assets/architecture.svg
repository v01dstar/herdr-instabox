<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Cloud machines. Native Herdr workspaces.</title>
  <desc id="desc">Manage InstaBox cloud machines from Herdr settings and connect through native SSH remotes. Save prepared environments as snapshots and create new machines from them. Code lives on the remote machine, without automatic local-file mirroring.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="20" fill="#101827"/>
  <g font-family="system-ui,sans-serif">
    <text x="36" y="48" fill="#f1f5f9" font-size="25" font-weight="700">Cloud machines. Native Herdr workspaces.</text>
    <text x="36" y="77" fill="#b5c4d6" font-size="15">Create · connect · work · snapshot · repeat</text>
    <rect x="36" y="130" width="240" height="160" rx="12" fill="#1e293b" stroke="#6db8ff"/>
    <text x="56" y="166" fill="#6db8ff" font-size="21" font-weight="700">Herdr</text>
    <text x="56" y="199" fill="#e2e8f0" font-size="14">Manage machines in settings</text>
    <text x="56" y="224" fill="#e2e8f0" font-size="14">Connect from the sidebar</text>
    <text x="56" y="269" fill="#b5c4d6" font-size="13">Your local control room</text>
    <path d="M276 218H348" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="313" y="199" text-anchor="middle" fill="#b5c4d6" font-size="11">API + SSH</text>
    <rect x="350" y="130" width="260" height="160" rx="12" fill="#153532" stroke="#76e6a3"/>
    <text x="370" y="166" fill="#76e6a3" font-size="21" font-weight="700">InstaBox machines</text>
    <text x="370" y="199" fill="#e2e8f0" font-size="14">Remote code + workspaces</text>
    <text x="370" y="224" fill="#e2e8f0" font-size="14">Persistent development disks</text>
    <text x="370" y="269" fill="#b5c4d6" font-size="13">Start · resume · suspend · stop</text>
    <path d="M612 218H682" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="647" y="199" text-anchor="middle" fill="#b5c4d6" font-size="11">Save / reuse</text>
    <rect x="684" y="130" width="240" height="160" rx="12" fill="#2c2540" stroke="#c4a6ff"/>
    <text x="704" y="166" fill="#c4a6ff" font-size="21" font-weight="700">Snapshots</text>
    <text x="704" y="199" fill="#e2e8f0" font-size="14">Save a prepared environment</text>
    <text x="704" y="224" fill="#e2e8f0" font-size="14">Create another machine</text>
    <text x="704" y="269" fill="#b5c4d6" font-size="13">Set up once. Reuse your setup.</text>
    <text x="36" y="333" fill="#b5c4d6" font-size="14">Work directly on your cloud machine. No automatic local checkout upload or file mirroring.</text>
  </g>
</svg>
