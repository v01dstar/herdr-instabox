id = "v01dstar.instabox"
name = "Instabox"
version = "0.5.1"
min_herdr_version = "0.9.0"
description = "create and manage instabox cloud machines, persistent workspaces and reusable snapshots in herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-instabox", "."]

# herdr has no manifest field for keys, so bind the defaults in config.toml.
# Keys or actions the user has already bound are left alone.
[[build]]
command = ["bin/herdr-instabox", "install-keys"]

# Reconcile herdr's saved machines with instabox when herdr starts...
[[startup]]
command = ["bin/herdr-instabox", "sync"]

# ...and, at most once a minute, as you move around.
[[events]]
on = "workspace.focused"
command = ["bin/herdr-instabox", "sync", "--if-stale"]

[[events]]
on = "workspace.created"
command = ["bin/herdr-instabox", "sync", "--if-stale"]

[[actions]]
id = "open"
title = "instabox settings"
contexts = ["workspace"]
command = ["bin/herdr-instabox", "open"]

[[actions]]
id = "new-workspace"
title = "New workspace on the default machine"
contexts = ["workspace"]
command = ["bin/herdr-instabox", "new-workspace"]

[[actions]]
id = "setup"
title = "Set up an InstaBox account"
contexts = ["workspace"]
command = ["bin/herdr-instabox", "open", "account"]

[[actions]]
id = "doctor"
title = "InstaBox local diagnostics (read-only)"
contexts = ["workspace"]
command = ["bin/herdr-instabox", "doctor", "--json"]

# Switch these to placement = "popup" once the installed herdr supports it.
[[panes]]
id = "ui"
title = "instabox settings"
placement = "overlay"
command = ["bin/herdr-instabox", "ui"]

[[panes]]
id = "snapshots"
title = "instabox settings"
placement = "overlay"
command = ["bin/herdr-instabox", "ui", "snapshots"]

[[panes]]
id = "account"
title = "instabox settings"
placement = "overlay"
command = ["bin/herdr-instabox", "ui", "account"]
